<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>धुन — ankit's music, live from spotify</title>
<meta name="description" content="Ankit's live Spotify listening data — one song at a time, playing on into the next." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌙</text></svg>" />
<style>
  :root{
    --ink:#f3ecdd;
    --ink-dim:rgba(243,236,221,.66);
    --ink-faint:rgba(243,236,221,.4);
    --accent:#e8b74d;
    --card:rgba(20,16,28,.42);
    --card-border:rgba(255,255,255,.10);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:#0a0a14;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
    min-height:100vh; overflow-x:hidden;
  }
  a{ color:inherit; }
  button{ font-family:inherit; }

  /* ---------- cinematic scene (blurred album art fills the screen) ---------- */
  #scene{ position:fixed; inset:0; z-index:0; background:#0a0a14; overflow:hidden; }
  .scene-img{
    position:absolute; inset:-6%; width:112%; height:112%; object-fit:cover;
    filter: blur(48px) saturate(1.25) brightness(.42);
    opacity:0; transition: opacity 1.6s ease;
    transform: scale(1.04);
  }
  .scene-img.active{ opacity:1; }
  .scene-overlay{
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse 90% 60% at 50% 8%, rgba(0,0,0,0), rgba(6,5,12,.55) 75%),
      linear-gradient(180deg, rgba(6,5,12,.35) 0%, rgba(6,5,12,.55) 55%, rgba(6,5,12,.86) 100%);
  }
  #stars{
    position:absolute; inset:0;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 22%, rgba(255,255,255,.8), transparent),
      radial-gradient(1px 1px at 32% 68%, rgba(255,255,255,.6), transparent),
      radial-gradient(2px 2px at 72% 18%, rgba(255,255,255,.75), transparent),
      radial-gradient(1px 1px at 86% 48%, rgba(255,255,255,.5), transparent),
      radial-gradient(1.5px 1.5px at 57% 82%, rgba(255,255,255,.65), transparent);
    background-repeat: repeat; background-size: 600px 600px;
    animation: drift 110s linear infinite; opacity:.5;
  }
  @keyframes drift{ from{background-position:0 0;} to{background-position:-600px 300px;} }

  .wrap{ position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column; }

  /* ---------- top bar ---------- */
  .topbar{ display:flex; justify-content:space-between; align-items:center; font-size:13px; color: var(--ink-dim); padding: 20px 24px 0; letter-spacing:.03em; }
  .topbar .dot{ display:inline-block; width:6px; height:6px; border-radius:50%; background:#7ee08a; margin-right:6px; box-shadow:0 0 8px #7ee08a; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  /* ---------- layout ---------- */
  .layout{ flex:1; display:flex; gap:0; align-items:stretch; max-width:1180px; margin:0 auto; width:100%; padding: 0 24px 24px; }

  /* ---------- stage (now playing) ---------- */
  .stage{ flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding: 30px 20px 10px; }
  .kicker{ font-size:12.5px; letter-spacing:.14em; text-transform:uppercase; color: var(--ink-faint); margin-bottom:22px; }
  .kicker b{ color: var(--ink-dim); font-weight:600; }
  .stage-art{ width:min(300px, 56vw); aspect-ratio:1; border-radius:18px; overflow:hidden; box-shadow: 0 30px 80px -20px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.06); margin-bottom:26px; background:#181622; }
  .stage-art img{ width:100%; height:100%; object-fit:cover; display:block; }
  .stage-title{ font-size: clamp(22px, 3.4vw, 32px); font-weight:700; max-width:560px; line-height:1.25; }
  .stage-artist{ font-size:15px; color: var(--ink-dim); margin-top:6px; }

  .controls-row{ display:flex; align-items:center; gap:22px; margin-top:30px; }
  .controls-row button{ background:none; border:none; color: var(--ink); cursor:pointer; padding:0; display:flex; align-items:center; justify-content:center; transition: transform .1s, opacity .15s; }
  .controls-row button:hover{ opacity:.8; }
  .controls-row button:active{ transform: scale(.9); }
  #btn-prev, #btn-next{ font-size:22px; color: var(--ink-dim); }
  #btn-playpause{
    width:60px; height:60px; border-radius:50%; background: var(--ink); color:#191410; font-size:20px;
  }
  #btn-playpause:hover{ opacity:.92; }

  .progress{ width:min(420px, 82vw); margin-top:22px; }
  .progress-bar{ height:4px; border-radius:99px; background: rgba(255,255,255,.16); cursor:pointer; position:relative; }
  .progress-fill{ height:100%; border-radius:99px; background: var(--ink); width:0%; }
  .progress-times{ display:flex; justify-content:space-between; font-size:11px; color: var(--ink-faint); margin-top:7px; font-variant-numeric: tabular-nums; }

  .spotify-badge{ margin-top:20px; display:flex; align-items:center; gap:8px; font-size:11.5px; color: var(--ink-faint); }
  .spotify-badge svg{ width:14px; height:14px; opacity:.7; flex-shrink:0; }
  #embed-holder{ position:fixed; width:1px; height:1px; overflow:hidden; opacity:0; pointer-events:none; left:-9999px; }

  /* ---------- queue panel ---------- */
  .queue-panel{
    width:320px; flex-shrink:0; margin: 30px 0 10px 8px;
    background: var(--card); border:1px solid var(--card-border); border-radius:20px;
    backdrop-filter: blur(18px); display:flex; flex-direction:column; max-height: calc(100vh - 110px); position:sticky; top:30px;
  }
  .queue-tabs{ display:flex; gap:4px; padding:12px; border-bottom:1px solid rgba(255,255,255,.07); flex-wrap:wrap; }
  .queue-tabs button{ border:none; background:transparent; color: var(--ink-faint); padding:6px 11px; border-radius:999px; font-size:12px; cursor:pointer; transition: background .15s, color .15s; }
  .queue-tabs button.active{ background: var(--accent); color:#1a1408; font-weight:600; }
  .queue-tabs button:not(.active):hover{ color: var(--ink); background: rgba(255,255,255,.06); }

  .queue-list{ overflow-y:auto; padding:8px; }
  .queue-row{
    display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    background:none; border:none; border-radius:12px; padding:8px 10px; cursor:pointer; color: var(--ink);
    transition: background .12s;
  }
  .queue-row:hover{ background: rgba(255,255,255,.06); }
  .queue-row.active{ background: rgba(232,183,77,.14); }
  .queue-row img{ width:42px; height:42px; border-radius:8px; object-fit:cover; flex-shrink:0; background:#1c1c2c; }
  .queue-meta{ min-width:0; flex:1; }
  .queue-name{ font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .queue-row.active .queue-name{ color: var(--accent); }
  .queue-artist{ font-size:11.5px; color: var(--ink-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
  .queue-when{ font-size:10px; color: var(--ink-faint); flex-shrink:0; }
  .queue-playing-icon{ width:16px; flex-shrink:0; color: var(--accent); font-size:13px; }

  footer{ text-align:center; padding: 6px 0 22px; color: var(--ink-faint); font-size:11.5px; position:relative; z-index:1; }
  footer a{ color: var(--accent); text-decoration:none; }

  @media (max-width: 860px){
    .layout{ flex-direction:column; padding: 0 16px 20px; }
    .queue-panel{ width:100%; margin: 18px 0 0; max-height:340px; position:static; }
    .stage{ padding-top:14px; }
  }
</style>
</head>
<body>
  <div id="scene">
    <img class="scene-img active" id="scene-img-a" alt="" />
    <img class="scene-img" id="scene-img-b" alt="" />
    <div id="stars"></div>
    <div class="scene-overlay"></div>
  </div>

  <div class="wrap">
    <div class="topbar">
      <span id="clock">--:--</span>
      <span><span class="dot"></span><span id="online">-- </span>dost online</span>
    </div>

    <div class="layout">
      <div class="stage">
        <div class="kicker">धुन · <b id="profile-name">ankit</b>'s music, live from Spotify</div>

        <div class="stage-art"><img id="stage-art" alt="" /></div>
        <div class="stage-title" id="np-title">Loading…</div>
        <div class="stage-artist" id="np-artist">&nbsp;</div>

        <div class="controls-row">
          <button id="btn-prev" aria-label="Previous track" title="Previous">⏮</button>
          <button id="btn-playpause" aria-label="Play or pause" title="Play/Pause">▶</button>
          <button id="btn-next" aria-label="Next track" title="Next">⏭</button>
        </div>

        <div class="progress">
          <div class="progress-bar" id="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
          <div class="progress-times"><span id="time-cur">0:00</span><span id="time-dur">0:00</span></div>
        </div>

        <div class="spotify-badge">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24 0-.36-.06-.6-.18-1.68-.96-3.6-1.44-5.94-1.44-1.32 0-2.76.18-4.08.48-.18 0-.42.12-.54.12-.42 0-.72-.3-.72-.72 0-.42.24-.66.66-.78 1.68-.36 3.3-.6 4.86-.6 2.58 0 4.86.6 6.72 1.68.3.18.48.36.48.78 0 .42-.36.66-.66.66zm1.44-3.3c-.3 0-.48-.12-.72-.24-1.98-1.14-4.62-1.8-7.5-1.8-1.44 0-2.94.18-4.32.54-.18.06-.3.06-.48.06-.54 0-.96-.42-.96-.96 0-.54.3-.84.72-.96 1.68-.48 3.36-.66 5.1-.66 3.12 0 6 .72 8.28 2.04.3.18.6.48.6 1.02 0 .54-.42.96-.72.96zm1.68-3.96c-.36 0-.6-.12-.84-.24-2.4-1.44-6.24-2.28-9.9-2.28-1.86 0-3.72.24-5.4.72-.24.06-.36.12-.6.12-.6 0-1.08-.48-1.08-1.08 0-.6.36-.96.84-1.08 2.04-.6 4.14-.84 6.24-.84 4.14 0 8.34 1.02 11.16 2.7.36.24.6.6.6 1.14 0 .6-.48 1.08-1.02 1.08z"/></svg>
          <span>playing via Spotify · <span id="spotify-note">preview unless you're signed in</span></span>
        </div>
        <div id="embed-holder"></div>
      </div>

      <aside class="queue-panel">
        <div class="queue-tabs" id="queue-tabs">
          <button data-src="recent">recent</button>
          <button data-src="short_term">4 weeks</button>
          <button data-src="medium_term" class="active">6 months</button>
          <button data-src="long_term">all time</button>
        </div>
        <div class="queue-list" id="queue-list"></div>
      </aside>
    </div>

    <footer>धुन · a live snapshot of one person's listening habits · updated <span id="freshness">just now</span></footer>
  </div>

<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
<script>
(function(){
  "use strict";

  var state = {
    data: null,
    src: "medium_term",
    queue: [],
    index: 0,
    controller: null,
    controllerReady: false,
    pendingUri: null,
    pendingAutoplay: false,
    wasPlaying: false,
    sceneActive: "a",
    seeking: false,
    lastDuration: 0,
  };

  // ---------------- clock + fake "online" counter ----------------
  function tickClock(){
    var d = new Date();
    var h = d.getHours(), m = d.getMinutes();
    var ampm = h >= 12 ? "pm" : "am";
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    document.getElementById("clock").textContent =
      (h12 < 10 ? "0"+h12 : h12) + ":" + (m < 10 ? "0"+m : m) + " " + ampm;
  }
  tickClock(); setInterval(tickClock, 15000);

  var onlineBase = 12 + Math.floor(Math.random() * 40);
  function tickOnline(){
    onlineBase = Math.max(3, onlineBase + Math.floor(Math.random()*7) - 3);
    document.getElementById("online").textContent = onlineBase + " ";
  }
  tickOnline(); setInterval(tickOnline, 6000);

  // ---------------- helpers ----------------
  function esc(s){
    return (s == null ? "" : String(s)).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function artistNames(t){ return (t.artists || []).join(", "); }
  function fmtTime(ms){
    if (!ms || ms < 0) return "0:00";
    var s = Math.floor(ms/1000);
    var m = Math.floor(s/60); s = s % 60;
    return m + ":" + (s < 10 ? "0"+s : s);
  }
  function timeAgo(iso){
    if (!iso) return "";
    var then = new Date(iso).getTime();
    if (isNaN(then)) return "";
    var mins = Math.round((Date.now() - then) / 60000);
    if (mins < 1) return "now";
    if (mins < 60) return mins + "m";
    var hrs = Math.round(mins/60);
    if (hrs < 24) return hrs + "h";
    return Math.round(hrs/24) + "d";
  }
  function freshnessLabel(iso){
    if (!iso) return "recently";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "recently";
    var days = Math.floor((Date.now() - d.getTime()) / 86400000);
    if (days <= 0) return "today";
    if (days === 1) return "yesterday";
    if (days < 7) return days + " days ago";
    return d.toLocaleDateString(undefined, {month:"short", day:"numeric"});
  }

  // ---------------- cinematic scene crossfade ----------------
  function setScene(url){
    if (!url) return;
    var a = document.getElementById("scene-img-a");
    var b = document.getElementById("scene-img-b");
    var incoming = state.sceneActive === "a" ? b : a;
    var outgoing = state.sceneActive === "a" ? a : b;
    incoming.onload = function(){
      incoming.classList.add("active");
      outgoing.classList.remove("active");
    };
    incoming.src = url;
    state.sceneActive = state.sceneActive === "a" ? "b" : "a";
  }

  // ---------------- Spotify iFrame API ----------------
  window.onSpotifyIframeApiReady = function(IFrameAPI){
    var el = document.getElementById("embed-holder");
    IFrameAPI.createController(el, { uri: "", width: "1", height: "1" }, function(controller){
      state.controller = controller;
      state.controllerReady = true;
      controller.addListener("playback_update", onPlaybackUpdate);
      if (state.pendingUri) {
        controller.loadUri(state.pendingUri);
        if (state.pendingAutoplay) setTimeout(function(){ controller.play(); }, 250);
        state.pendingUri = null;
      }
    });
  };

  function onPlaybackUpdate(e){
    var d = e.data || {};
    var duration = d.duration || 0;
    var position = d.position || 0;
    var isPaused = !!d.isPaused;

    if (duration) state.lastDuration = duration;
    updateProgressUI(position, duration || state.lastDuration);
    setPlayIcon(!isPaused);

    if (!isPaused && position > 1000) state.wasPlaying = true;

    // Two end-of-track signals seen in practice:
    //  - logged-in / full playback: resets to isPaused=true, position=0
    //  - logged-out / 30s preview: sticks at position === duration, isPaused stays false
    var resetToStart = state.wasPlaying && isPaused && position === 0;
    var stuckAtEnd = duration > 0 && position >= duration - 400;
    if (!state.endedHandled && (resetToStart || stuckAtEnd)) {
      state.endedHandled = true;
      state.wasPlaying = false;
      advanceOnEnd();
    }
  }

  function updateProgressUI(position, duration){
    if (state.seeking) return;
    var pct = duration ? Math.min(100, (position/duration)*100) : 0;
    document.getElementById("progress-fill").style.width = pct + "%";
    document.getElementById("time-cur").textContent = fmtTime(position);
    document.getElementById("time-dur").textContent = fmtTime(duration);
  }

  function setPlayIcon(isPlaying){
    document.getElementById("btn-playpause").textContent = isPlaying ? "⏸" : "▶";
  }

  function advanceOnEnd(){
    playIndex(state.index + 1, true);
  }

  // ---------------- player control ----------------
  function loadIntoPlayer(track, autoplay){
    if (!track) return;
    var uri = "spotify:track:" + track.id;
    if (state.controllerReady && state.controller) {
      state.controller.loadUri(uri);
      if (autoplay) setTimeout(function(){ state.controller.play(); }, 250);
    } else {
      state.pendingUri = uri;
      state.pendingAutoplay = !!autoplay;
    }
    state.endedHandled = false;
    document.getElementById("np-title").textContent = track.name || "";
    document.getElementById("np-artist").textContent = artistNames(track);
    var art = track.art || track.art_small || "";
    document.getElementById("stage-art").src = art;
    setScene(art);
    document.getElementById("progress-fill").style.width = "0%";
    document.getElementById("time-cur").textContent = "0:00";
    document.getElementById("time-dur").textContent = fmtTime(track.duration_ms);
    highlightActiveRow(track.id);
  }

  function playIndex(i, autoplay){
    if (!state.queue.length) return;
    state.index = ((i % state.queue.length) + state.queue.length) % state.queue.length;
    loadIntoPlayer(state.queue[state.index], autoplay !== false);
  }

  document.getElementById("btn-prev").addEventListener("click", function(){ playIndex(state.index - 1, true); });
  document.getElementById("btn-next").addEventListener("click", function(){ playIndex(state.index + 1, true); });
  document.getElementById("btn-playpause").addEventListener("click", function(){
    if (!state.controllerReady) return;
    state.controller.togglePlay();
  });

  var progressBar = document.getElementById("progress-bar");
  progressBar.addEventListener("click", function(e){
    if (!state.controllerReady || !state.lastDuration) return;
    var rect = progressBar.getBoundingClientRect();
    var pct = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    state.controller.seek(Math.round(pct * state.lastDuration));
  });

  function highlightActiveRow(id){
    document.querySelectorAll(".queue-row").forEach(function(r){
      r.classList.toggle("active", r.getAttribute("data-id") === id);
    });
  }

  // ---------------- queue list ----------------
  function currentList(){
    if (state.src === "recent") return state.data.recent || [];
    return (state.data.tracks && state.data.tracks[state.src]) || [];
  }

  function renderQueue(){
    var list = currentList();
    state.queue = list;
    var el = document.getElementById("queue-list");
    if (!list.length){
      el.innerHTML = '<div style="padding:16px;color:var(--ink-faint);font-size:13px;">No data for this range yet.</div>';
      return;
    }
    el.innerHTML = list.map(function(t, i){
      var when = state.src === "recent" ? '<span class="queue-when">'+esc(timeAgo(t.played_at))+'</span>' : '';
      return '<button class="queue-row" data-id="'+esc(t.id)+'" data-i="'+i+'">' +
        '<img src="'+esc(t.art_small || t.art || "")+'" alt="" loading="lazy" />' +
        '<div class="queue-meta"><div class="queue-name">'+esc(t.name)+'</div>' +
        '<div class="queue-artist">'+esc(artistNames(t))+'</div></div>' +
        when +
        '</button>';
    }).join("");
    el.querySelectorAll(".queue-row").forEach(function(row){
      row.addEventListener("click", function(){
        playIndex(parseInt(row.getAttribute("data-i"), 10), true);
      });
    });
  }

  document.getElementById("queue-tabs").addEventListener("click", function(e){
    var btn = e.target.closest("button[data-src]");
    if (!btn) return;
    state.src = btn.getAttribute("data-src");
    document.querySelectorAll("#queue-tabs button").forEach(function(b){
      b.classList.toggle("active", b === btn);
    });
    renderQueue();
    if (state.queue.length) playIndex(0, false);
  });

  function renderHeader(){
    var p = state.data.profile || {};
    document.getElementById("profile-name").textContent = p.name || "ankit";
    document.getElementById("freshness").textContent = freshnessLabel(state.data.generated_at);
  }

  // ---------------- boot ----------------
  fetch("songs.json", { cache: "no-store" })
    .then(function(r){
      if (!r.ok) throw new Error("songs.json " + r.status);
      return r.json();
    })
    .then(function(data){
      state.data = data;
      renderHeader();
      renderQueue();
      if (state.queue.length) playIndex(0, false);
    })
    .catch(function(err){
      document.getElementById("np-title").textContent = "Couldn't load listening data";
      document.getElementById("np-artist").textContent = String(err.message || err);
      console.error(err);
    });
})();
</script>
</body>
</html>
